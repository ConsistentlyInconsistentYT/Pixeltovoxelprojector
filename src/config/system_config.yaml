  # Hardware trigger synchronization
  trigger:
    enabled: true
    source: "external"  # external, software, freerun
    frequency: 30.0  # Hz
    delay_us: 0.0

  # Network settings (GigE Vision)
  network:
    packet_size: 9000  # MTU (Jumbo frames)
    packet_delay: 1000  # microseconds
    bandwidth_reserve: 10.0  # Percent
    timeout_ms: 1000

# ============================================================================
# VOXEL GRID CONFIGURATION
# ============================================================================
voxel_grid:
  # Grid dimensions
  center: [0.0, 0.0, 500.0]  # [x, y, z] in meters
  size: [5000.0, 5000.0, 2000.0]  # [width, height, depth] in meters
  base_resolution: 1.0  # meters per voxel

  # Level of Detail (LOD) settings
  enable_lod: true
  lod_levels:
    ultra_high:
      resolution: 0.1  # meters
      max_distance: 100.0  # meters
    high:
      resolution: 0.25
      max_distance: 500.0
    medium:
      resolution: 0.5
      max_distance: 1000.0
    low:
      resolution: 1.0
      max_distance: 5000.0
    ultra_low:
      resolution: 2.0
      max_distance: 10000.0

  # Memory management
  max_memory_mb: 500
  enable_compression: true
  prune_threshold: 0.01
  update_rate_hz: 30.0

  # Dynamic grid management
  auto_adjust: true
  adjustment_margin_m: 500.0
  min_size: [1000.0, 1000.0, 500.0]

# ============================================================================
# DETECTION AND TRACKING CONFIGURATION
# ============================================================================
detection:
  # Motion detection thresholds
  motion_threshold: 0.2
  min_object_size_px: 10
  max_object_size_px: 1000

  # Detection confidence
  detection_confidence: 0.5
  confirmation_threshold: 3  # Frames before track confirmed

  # Tracking parameters
  max_tracks: 200
  max_age: 10  # Frames without detection before deletion
  iou_threshold: 0.3
  max_velocity: 50.0  # pixels/frame

  # Occlusion handling
  enable_occlusion_recovery: true
  occlusion_timeout_frames: 30

  # Performance
  enable_kalman_filter: true
  enable_trajectory_prediction: true

# Fusion settings
fusion:
  # Thermal-monochrome fusion
  thermal_threshold: 0.3
  mono_threshold: 0.2
  confidence_threshold: 0.6

  # Registration
  registration_update_interval_s: 1.0
  ransac_threshold: 3.0
  max_iterations: 1000

  # Enhancement
  enable_thermal_enhancement: true
  low_light_threshold: 0.1
  thermal_palette: "iron"  # iron, rainbow, grayscale

  # False positive reduction
  enable_false_positive_reduction: true
  cross_validation_required: true

  # Performance
  enable_cuda: true
  num_worker_threads: 4

# ============================================================================
# NETWORK STREAMING CONFIGURATION
# ============================================================================
network:
  # Protocol settings
  protocol: "mtrtp"  # Motion Tracking Real-Time Protocol
  transport: "shared_memory"  # shared_memory, udp, tcp

  # Shared memory settings
  shared_memory:
    name: "/mtrtp_motion_tracking"
    size_mb: 64
    num_buffers: 3

  # UDP settings
  udp:
    host: "0.0.0.0"
    port: 8888
    buffer_size: 65536
    multicast: false
    multicast_group: "239.1.1.1"

  # TCP settings
  tcp:
    host: "0.0.0.0"
    port: 8889
    max_connections: 10
    keep_alive: true

  # Compression
  compression: "lz4"  # none, lz4, zstd
  compression_level: 1

  # Streaming
  stream_coordinates: true
  stream_camera_pose: true
  stream_tracking: true
  stream_system_status: true
  update_rate_hz: 30.0

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================
performance:
  # Threading
  num_processing_threads: 8
  num_fusion_threads: 4
  num_tracking_threads: 2

  # GPU acceleration
  enable_gpu: true
  gpu_device_id: 0
  cuda_streams: 4

  # Memory management
  enable_memory_pooling: true
  preallocate_buffers: true
  max_buffer_age_frames: 60

  # Pipeline optimization
  enable_prefetch: true
  pipeline_depth: 3
  enable_parallel_processing: true

  # Priority settings
  process_priority: "high"  # normal, high, realtime
  thread_affinity: true
  numa_aware: true

# ============================================================================
# MONITORING AND LOGGING
# ============================================================================
monitoring:
  # System monitoring
  enabled: true
  update_rate_hz: 10.0

  # Metrics collection
  collect_performance_metrics: true
  collect_hardware_metrics: true
  collect_network_metrics: true
  collect_camera_metrics: true
  collect_detection_metrics: true

  # History
  history_size: 300  # samples (30 seconds at 10Hz)
  save_metrics: true
  metrics_file: "logs/system_metrics.json"

  # Alerts
  enable_alerts: true
  alert_thresholds:
    cpu_percent: 90
    memory_percent: 90
    gpu_temp_celsius: 85
    camera_drop_rate_percent: 5
    tracking_latency_ms: 100

  # Health checks
  health_check_interval_s: 5.0
  auto_recovery: true
  max_recovery_attempts: 3

logging:
  # Log files
  log_dir: "logs"
  log_file: "motion_tracking.log"
  max_file_size_mb: 100
  backup_count: 5

  # Log levels by component
  levels:
    root: "INFO"
    camera: "INFO"
    detection: "INFO"
    tracking: "INFO"
    fusion: "INFO"
    voxel: "INFO"
    network: "INFO"
    pipeline: "INFO"
    monitor: "WARNING"

  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

  # Console output
  console_output: true
  console_level: "INFO"
  colorized: true

# ============================================================================
# DATA RECORDING
# ============================================================================
recording:
  # Enable recording
  enabled: false

  # Recording paths
  output_dir: "recordings"
  session_name: "session_{timestamp}"

  # What to record
  record_raw_video: false
  record_motion_data: true
  record_tracking_data: true
  record_system_metrics: true

  # Video recording
  video_codec: "h265"
  video_quality: 23
  video_fps: 30.0

  # Data format
  data_format: "msgpack"  # json, msgpack, protobuf
  compression: true

  # Storage limits
  max_session_size_gb: 100
  auto_cleanup: true
  retention_days: 30

# ============================================================================
# CALIBRATION SETTINGS
# ============================================================================
calibration:
  # Calibration files directory
  calibration_dir: "config/calibration"

  # Auto-calibration
  auto_calibrate: false
  calibration_interval_hours: 24

  # Validation
  validate_on_startup: true
  max_calibration_error_px: 2.0
  min_calibration_points: 100

  # Online calibration refinement
  enable_online_refinement: false
  refinement_interval_s: 300

# ============================================================================
# SAFETY AND LIMITS
# ============================================================================
limits:
  # Resource limits
  max_cpu_percent: 95
  max_memory_percent: 90
  max_gpu_temp_celsius: 85
  max_network_bandwidth_mbps: 9000

  # Operational limits
  min_camera_fps: 25.0
  max_camera_drop_rate_percent: 5.0
  max_processing_latency_ms: 100
  max_tracking_latency_ms: 50

  # Emergency shutdown
  enable_emergency_shutdown: true
  shutdown_on_overheat: true
  shutdown_on_critical_error: true

# ============================================================================
# DEVELOPMENT AND DEBUG
# ============================================================================
debug:
  # Debug mode
  enabled: false

  # Profiling
  enable_profiling: false
  profile_output: "logs/profile.txt"

  # Visualization
  enable_visualization: false
  visualization_fps: 10.0

  # Simulation mode
  simulation_mode: false
  synthetic_data: false

  # Testing
  inject_errors: false
  error_rate: 0.001
